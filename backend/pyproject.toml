[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-customer-service-backend"
version = "0.1.0"
description = "AI Customer Service Runtime backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "httpx>=0.27,<1.0",
    "redis>=5.0,<6.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.24,<1.0"]
vision = ["torch>=2.5,<3.0", "transformers>=4.45,<5.0", "Pillow>=10.0,<12.0", "numpy>=2.0,<3.0", "pgvector>=0.3,<1.0", "hf_xet>=1.6,<2.0"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"
