<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 客服 · 后端配置</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="eyebrow">AI CUSTOMER SERVICE / MODEL SETTINGS</div>
        <h1>连接你的云端大脑。</h1>
        <p>选择模型供应商，粘贴 API Key。保存后，客服窗口会立即使用新的配置。</p>
        <div class="live-pill"><span></span> 后端服务在线</div>
      </section>

      <section class="grid">
        <form id="config-form" class="card form-card">
          <div class="card-heading"><div><span class="kicker">MODEL PROVIDER</span><h2>模型连接</h2></div><span id="connection-badge" class="badge">未连接</span></div>
          <div id="provider-picker" class="provider-picker"></div>
          <input id="llm_provider" type="hidden" value="openai_compatible" />
          <label>Base URL<input id="llm_base_url" type="url" placeholder="https://api.deepseek.com/v1" required /></label>
          <label>Model<input id="llm_model" placeholder="deepseek-chat" required /></label>
          <label>API Key <span class="label-hint">从供应商控制台创建</span><div class="key-row"><input id="llm_api_key" type="password" placeholder="粘贴你的 API Key" autocomplete="new-password" /><button type="button" id="toggle-key" class="ghost">显示</button></div></label>
          <div class="two-col"><label>Base URL<input id="llm_base_url" type="url" placeholder="https://api.deepseek.com/v1" required /></label><label>模型名称<input id="llm_model" placeholder="deepseek-chat" required /></label></div>
          <details><summary>高级设置 <span>Temperature、产品工具</span></summary><label>Temperature<div class="range-row"><input id="llm_temperature" type="range" min="0" max="2" step="0.1" /><output id="temperature-value">0.3</output></div></label><label class="switch-label"><input id="product_capability_enabled" type="checkbox" /><span class="switch"></span>启用产品目录工具</label></details>
          <button class="save" type="submit">保存连接 <span>⌘ Enter</span></button>
          <div id="notice" class="notice" role="status"></div>
        </form>

        <aside class="card status-card">
          <div class="card-heading"><div><span class="kicker">02 / STATUS</span><h2>运行状态</h2></div><div id="status-dot" class="status-dot"></div></div>
          <div class="status-main"><div id="status-title">等待连接</div><p id="status-subtitle">配置模型后，AI 客服才能开始工作。</p></div>
          <dl class="facts"><div><dt>供应商</dt><dd id="fact-provider">—</dd></div><div><dt>当前模型</dt><dd id="fact-model">—</dd></div><div><dt>Key 状态</dt><dd id="fact-key">未设置</dd></div></dl>
          <div class="tip"><strong>你的 Key 是安全的</strong><br />只保存在当前后端进程内存，重启后需要重新配置。</div>
        </aside>
      </section>
      <footer>AI Customer Service · Admin Console <span>127.0.0.1:8001</span></footer>
    </main>
    <script src="/admin/admin.js"></script>
  </body>
</html>
