<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 客服 · 后端配置</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="eyebrow">CUSTOMER SERVICE RUNTIME / CONTROL ROOM</div>
        <h1>让云端模型接管客服对话。</h1>
        <p>在这里连接 DeepSeek 或其他 OpenAI 兼容模型。配置即时生效，不需要改文件。</p>
        <div class="live-pill"><span></span> 后端服务在线</div>
      </section>

      <section class="grid">
        <form id="config-form" class="card form-card">
          <div class="card-heading"><div><span class="kicker">01 / MODEL</span><h2>云端模型</h2></div><span class="badge">LIVE</span></div>
          <label>Provider<select id="llm_provider"><option value="openai_compatible">OpenAI Compatible</option><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option></select></label>
          <label>Base URL<input id="llm_base_url" type="url" placeholder="https://api.deepseek.com/v1" required /></label>
          <label>Model<input id="llm_model" placeholder="deepseek-chat" required /></label>
          <label>API Key<div class="key-row"><input id="llm_api_key" type="password" placeholder="留空则保留当前 Key" autocomplete="new-password" /><button type="button" id="toggle-key" class="ghost">显示</button></div></label>
          <label>Temperature<div class="range-row"><input id="llm_temperature" type="range" min="0" max="2" step="0.1" /><output id="temperature-value">0.3</output></div></label>
          <label class="switch-label"><input id="product_capability_enabled" type="checkbox" /><span class="switch"></span>启用产品目录工具</label>
          <button class="save" type="submit">保存并立即生效 <span>→</span></button>
          <div id="notice" class="notice" role="status"></div>
        </form>

        <aside class="card status-card">
          <div class="card-heading"><div><span class="kicker">02 / STATUS</span><h2>运行状态</h2></div><div id="status-dot" class="status-dot"></div></div>
          <div class="status-main"><div id="status-title">正在读取配置</div><p id="status-subtitle">—</p></div>
          <dl class="facts"><div><dt>当前模型</dt><dd id="fact-model">—</dd></div><div><dt>Key 状态</dt><dd id="fact-key">—</dd></div><div><dt>Memory</dt><dd id="fact-memory">—</dd></div></dl>
          <div class="tip"><strong>安全提示</strong><br />Key 不会回传到浏览器，也不会写入磁盘。重启后端后需重新配置。</div>
        </aside>
      </section>
      <footer>AI Customer Service · Admin Console <span>127.0.0.1:8001</span></footer>
    </main>
    <script src="/admin/admin.js"></script>
  </body>
</html>
